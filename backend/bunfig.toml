# bunfig.toml
[test]
root = "tests"                 # Test directory
timeout = 30000                 # 30 second timeout for tests
# jsx = "react-jsx"            # Only needed if testing React components

[install]
# Use bun's package manager optimizations
cache = true

# Path resolution for TypeScript path mappings (needed for production)
[resolve]
# Map @ paths to dist directory (absolute paths for production container)
alias = { "@/*" = "/app/dist/*", "@config/*" = "/app/dist/config/*", "@entities/*" = "/app/dist/entities/*", "@controllers/*" = "/app/dist/controllers/*", "@services/*" = "/app/dist/services/*", "@middlewares/*" = "/app/dist/middlewares/*", "@routes/*" = "/app/dist/routes/*", "@validators/*" = "/app/dist/validators/*", "@utils/*" = "/app/dist/utils/*", "@types/*" = "/app/dist/types/*" }
