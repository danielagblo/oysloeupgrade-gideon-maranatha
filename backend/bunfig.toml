# bunfig.toml
[test]
root = "tests"                 # Test directory
timeout = 30000                 # 30 second timeout for tests
# jsx = "react-jsx"            # Only needed if testing React components

[install]
# Use bun's package manager optimizations
cache = true

# Path resolution for TypeScript path mappings (needed for production)
[resolve]
# Map @ paths to src directory (relative to the file being executed)
alias = { "@/*" = "./dist/*", "@config/*" = "./dist/config/*", "@entities/*" = "./dist/entities/*", "@controllers/*" = "./dist/controllers/*", "@services/*" = "./dist/services/*", "@middlewares/*" = "./dist/middlewares/*", "@routes/*" = "./dist/routes/*", "@validators/*" = "./dist/validators/*", "@utils/*" = "./dist/utils/*", "@types/*" = "./dist/types/*" }
