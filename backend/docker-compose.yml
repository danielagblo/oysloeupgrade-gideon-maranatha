version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: oysloe-postgres
    environment:
      POSTGRES_DB: oysloe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oysloe-network

  redis:
    image: redis:7-alpine
    container_name: oysloe-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oysloe-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: oysloe-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@oysloe.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - oysloe-network

volumes:
  postgres_data:

networks:
  oysloe-network:
    driver: bridge
